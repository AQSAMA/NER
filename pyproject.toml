[project]
name = "medical-ner"
version = "0.1.0"
description = "Local-first blank-state medical named entity recognition pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Medical NER Contributors" }]
dependencies = [
  "datasets>=3.0",
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=16.0",
  "pydantic>=2.0",
  "regex>=2024.0.0",
  "rich>=13.0",
  "scikit-learn>=1.5",
  "seqeval>=1.2.2",
  "spacy>=3.7",
  "torch>=2.3",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.scripts]
medical-ner = "medical_ner.cli:app"

[project.optional-dependencies]
crf = ["pytorch-crf>=0.7.2"]
notebooks = ["ipykernel>=6.29", "jupyterlab>=4.0", "matplotlib>=3.8"]

[dependency-groups]
dev = [
  "pyright>=1.1.380",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_ner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
